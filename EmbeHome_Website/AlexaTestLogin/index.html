<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Login with EmbeHome</title>

  <style>
    :root {
      --primary: #009a9a;
      --primary-dark: #057575;
      --text: #202124;
      --muted: #667085;
      --border: #e6eaef;
      --danger: #d92d20;
      --bg: #f6fbfb;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 154, 154, 0.12), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 14px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin-top: 18px;
      background: var(--card);
      border: 1px solid rgba(0, 154, 154, 0.12);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(10, 45, 45, 0.12);
    }

    .header {
      padding: 24px 18px 20px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(0, 154, 154, 0.16), rgba(0, 154, 154, 0.04)),
        #ffffff;
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 24px rgba(0, 154, 154, 0.25);
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 750;
      color: #101828;
    }

    .brand-subtitle {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }

    .content {
      padding: 26px 20px 22px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
      color: #344054;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d0d5dd;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #101828;
      font-size: 15px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 154, 154, 0.14);
    }

    .message {
      display: none;
      margin: 4px 0 16px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #fecdca;
    }

    .message.info {
      display: block;
      color: #055c5c;
      background: #ecfdfd;
      border: 1px solid rgba(0, 154, 154, 0.22);
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      font-size: 16px;
      font-weight: 750;
      box-shadow: 0 12px 22px rgba(0, 154, 154, 0.22);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      box-shadow: none;
    }

    .forgot {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--primary-dark);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .small-note {
      margin: 18px 0 0;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var redirectUri = params.get("redirect_uri") || "";

      // Keep existing Google OAuth separation behavior.
      if (redirectUri.indexOf("oauth-redirect.googleusercontent.com") !== -1) {
        window.location.replace("../GoogleOAuthLogin/" + window.location.search);
      }
    })();
  </script>
</head>

<body>
  <main class="page">
    <section class="card" aria-label="EmbeHome login">
      <header class="header">
        <div class="brand-badge" aria-hidden="true">E</div>
        <h1 class="brand-title">Login</h1>
        <span class="brand-subtitle">Login with your existing EmbeHome ID</span>
      </header>

      <div class="content">
        <form id="submitUserDetails" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="form-control" id="email" type="email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required />
          </div>

          <!-- Values are intentionally blank. Alexa sends fresh state/redirect_uri in URL params. -->
          <input id="redirect_uri" type="hidden" name="redirect_uri" value="" />
          <input id="state" type="hidden" name="state" value="" />

          <div id="postResultDiv" role="alert"></div>

          <button id="submitBtn" class="submit-btn" type="submit">Submit</button>

          <a class="forgot" href="https://2ssquare.in/api/aws/forgotpassword">Forgot password?</a>

          <p class="small-note">After login, you will be redirected back to Alexa to finish account linking.</p>
        </form>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var AUTHORIZATION_URL = "https://2ssquare.in/api/aws/authorization";
      var REALM = "Smartron";

      var form = document.getElementById("submitUserDetails");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var redirectInput = document.getElementById("redirect_uri");
      var stateInput = document.getElementById("state");
      var messageBox = document.getElementById("postResultDiv");
      var submitBtn = document.getElementById("submitBtn");

      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name) || "";
      }

      function showMessage(type, text) {
        messageBox.className = "message " + type;
        messageBox.textContent = text;
      }

      function clearMessage() {
        messageBox.className = "";
        messageBox.textContent = "";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? "Please wait..." : "Submit";
      }

      var stateFromUrl = getParam("state");
      var redirectUriFromUrl = getParam("redirect_uri");

      redirectInput.value = redirectUriFromUrl;
      stateInput.value = stateFromUrl;

      console.log(
        "alexa_login_page_ready",
        "state=" + Boolean(stateFromUrl),
        "redirect_uri=" + Boolean(redirectUriFromUrl)
      );

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessage();

        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var state = getParam("state") || stateInput.value.trim();
        var redirectUri = getParam("redirect_uri") || redirectInput.value.trim();

        console.log(
          "alexa_login_submit_clicked",
          "state=" + Boolean(state),
          "redirect_uri=" + Boolean(redirectUri)
        );

        if (!state || !redirectUri) {
          showMessage("error", "Alexa linking session expired. Please start linking again from the Alexa app.");
          return;
        }

        if (!email || !isValidEmail(email)) {
          showMessage("error", "Please enter a valid email address.");
          emailInput.focus();
          return;
        }

        if (!password) {
          showMessage("error", "Please enter your password.");
          passwordInput.focus();
          return;
        }

        var payload = {
          email: email,
          password: password,
          realm: REALM,
          redirect_uri: redirectUri,
          state: state
        };

        setLoading(true);
        showMessage("info", "Verifying your EmbeHome account...");

        console.log("alexa_login_authorization_post_started");

        fetch(AUTHORIZATION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.text().then(function (rawText) {
              var data = null;

              try {
                data = rawText ? JSON.parse(rawText) : null;
              } catch (parseError) {
                console.error("alexa_login_invalid_json_response", parseError, rawText);
              }

              if (!response.ok) {
                var error = new Error("Authorization failed");
                error.status = response.status;
                error.responseText = rawText;
                throw error;
              }

              return data;
            });
          })
          .then(function (data) {
            var redirectUrl = data && data.url_string;

            console.log("alexa_login_auth_success", "redirect_present=" + Boolean(redirectUrl));

            if (!redirectUrl) {
              showMessage("error", "Login succeeded, but Alexa redirect URL was missing. Please contact support.");
              setLoading(false);
              return;
            }

            window.location.href = redirectUrl;
          })
          .catch(function (error) {
            console.error(
              "alexa_login_authorization_failed",
              "status=" + (error.status || "network_or_cors"),
              error.responseText || error.message
            );

            showMessage("error", "Invalid Username/Password or Alexa linking session expired.");
            setLoading(false);
          });
      });
    })();
  </script>
</body>
</html>
